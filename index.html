<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><meta name="theme-color" content="#121315"/><title>원패스 다이렉트 · 차량별 보험관리 시연</title>
<style>
:root{color-scheme:dark;--bg:#121315;--card:#222428;--edge:#373a40;--text:#f4f5f6;--muted:#9ea3aa;--blue:#4777f2;--mint:#8fe1c5}*{box-sizing:border-box}html{background:#0b0c0e}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}.app{max-width:440px;min-height:100dvh;margin:auto;background:var(--bg);padding-bottom:92px;box-shadow:0 0 70px #000b}header{height:70px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between}header strong{font-size:19px;letter-spacing:-.055em}header span{display:block;font-size:10px;color:var(--muted);letter-spacing:.15em;margin-top:3px}header .demo{font-size:10px;color:#91e7c1;border:1px solid #47675b;padding:7px 9px;border-radius:8px}main{padding:0 20px 40px}.topline{font-size:10px;letter-spacing:.13em;color:var(--mint);font-weight:700;margin:13px 0}.carSelect{display:block;width:100%;background:transparent;color:var(--text);border:none;font-size:27px;font-weight:750;letter-spacing:-.05em;outline:none;padding:5px 26px 5px 0;appearance:none}.chooseWrap{position:relative}.chooseWrap:after{content:'⌄';position:absolute;right:12px;top:0;font-size:29px;color:#81858b;pointer-events:none}.carSelect option{font-size:16px;color:black}.carIntro{font-size:12px;color:var(--muted);margin:0 0 4px}.carStage{height:252px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.carStage img{width:110%;max-width:none;max-height:240px;object-fit:contain;display:block;mix-blend-mode:lighten}.carStage.cyber img{max-height:221px}.plateArea{text-align:center;margin:-1px 0 24px}.plate{min-width:183px;display:inline-block;padding:5px 18px;border-radius:8px;border:2px solid #e8e8e8;outline:2px solid #141414;outline-offset:-6px;background:#f9f9f9;color:#101010;font-size:24px;letter-spacing:0;font-weight:850;box-shadow:0 0 0 1px #717171}.plateCaption{color:#838991;font-size:10px;margin-top:10px}.plateEmpty{display:inline-block;background:#26292d;border:1px dashed #73767b;border-radius:8px;padding:7px 14px;color:#adb1b7;font-size:13px}.card{border:1px solid var(--edge);border-radius:16px;padding:19px;background:var(--card);margin-bottom:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.label{font-size:12px;color:var(--muted)}.name{font-size:22px;font-weight:780;letter-spacing:-.05em;margin:9px 0}.small{font-size:12px;color:var(--muted);line-height:1.5}.status{font-size:10px;font-weight:750;color:#a4ebbe;background:#204839;padding:5px 8px;border-radius:999px}.hair{height:1px;background:var(--edge);margin:16px 0}.section{font-size:17px;font-weight:760;margin:24px 0 13px}.primary{display:flex;align-items:center;gap:14px;width:100%;padding:18px;background:var(--blue);color:white;text-align:left;border:0;border-radius:14px;cursor:pointer;font:inherit;margin:10px 0;min-height:68px}.primary.secondary{background:#292c31;border:1px solid #404249}.primary .glyph{font-size:26px;min-width:33px;text-align:center}.primary b{font-size:16px;display:block}.primary small{display:block;font-size:11px;opacity:.74;margin-top:4px}.primary .chev{margin-left:auto;color:#b8bbc3;font-size:22px}.menuLine{border:0;background:transparent;width:100%;border-bottom:1px solid #292b2d;padding:16px 3px;color:var(--text);text-align:left;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font:inherit}.menuLine span{font-size:14px}.menuLine i{font-style:normal;color:#777d85}.back{border:0;background:none;padding:15px 0 20px;color:#9ba3af;font:inherit;font-size:14px;cursor:pointer}.title{font-weight:780;font-size:26px;letter-spacing:-.05em;margin:4px 0 9px}.sub{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 24px}.formLabel{display:block;font-size:13px;margin:18px 0 7px}.field{width:100%;padding:14px 12px;border-radius:10px;background:#14161a;border:1px solid #50545a;color:var(--text);font-size:15px;font-family:inherit;outline:none}.field:focus{border-color:#6890fa}.actionButton{border:0;background:var(--blue);color:white;border-radius:12px;font-size:15px;font-weight:720;width:100%;padding:17px;cursor:pointer;margin-top:20px}.actionButton:disabled{opacity:.5;cursor:not-allowed}.check{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #383b3f;font-size:14px}.check input{accent-color:#6995fb;width:17px;height:17px}.count{font-size:36px;font-weight:850;color:#c3e3ff}.mutedBox{background:#24272b;padding:16px;border-radius:12px;margin-top:18px}.records{display:grid;gap:10px}.record{background:#24272b;border-radius:12px;padding:16px}.record span{font-size:12px;color:#aeb3bb}.record b{display:block;font-size:15px;margin-top:7px}nav{position:fixed;z-index:2;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);background:#17191c;border-top:1px solid #323338;display:flex;justify-content:space-around;padding:12px 8px max(13px,env(safe-area-inset-bottom))}nav button{font:inherit;font-size:11px;display:grid;gap:5px;justify-items:center;min-width:60px;border:0;background:transparent;color:#868e9a;cursor:pointer}nav button.on{color:#f7f7f7}nav button span{font-size:21px}.notice{font-size:11px;color:#878e98;line-height:1.65;margin:18px 0}.modalCover{position:fixed;inset:0;background:#000b;display:flex;align-items:end;justify-content:center;z-index:6}.modal{width:min(440px,100%);background:#26282c;border-radius:18px 18px 0 0;padding:25px 20px 35px}.modal h3{font-size:20px;margin:0 0 10px}.modal p{font-size:13px;line-height:1.7;color:#bec5cb}.modal button{width:100%;padding:14px;border:0;background:#4276eb;color:white;border-radius:10px;font-weight:700;font-size:15px}.inlineVehicle{padding:12px 0;display:flex;gap:10px;align-items:center;color:#d4dbdf;font-size:13px}.inlineVehicle img{width:70px;height:40px;object-fit:contain}a{color:#8fb5ff}@media(min-width:441px){body{padding:16px 0}.app{border-radius:22px;overflow:hidden;min-height:calc(100vh - 32px)}nav{bottom:16px;border-radius:0 0 18px 18px}}
</style></head><body><div class="app"><header><div><strong>원패스 다이렉트</strong><span>ONEPASS DIRECT</span></div><div class="demo">DEMO</div></header><main id="screen"></main><nav id="nav"></nav></div><div id="modalHost"></div>
<script>
'use strict';
// 모든 보험계약 정보 및 등록번호는 시연용 가상값입니다. 차량 이미지만 사용자가 제공한 캡처에서 발췌했습니다.
const vehicles=[
{id:'modely1',name:'Model Y',display:'Model Y · 첫 번째',plate:'00가 0001',image:'assets/tesla_model_y_user.png',insurer:'A손해보험',renew:'2027. 10. 17.',update:'2026. 11. 26.',phone:'',history:'시연용 접수 기록 없음'},
{id:'modely2',name:'Model Y',display:'Model Y · 두 번째',plate:'00가 0002',image:'assets/tesla_model_y_user.png',insurer:'B손해보험',renew:'2027. 08. 04.',update:'2026. 11. 12.',phone:'',history:'시연용 접수 기록 없음'},
{id:'cyber',name:'Cybertruck',display:'Cybertruck',plate:'00가 0003',image:'assets/tesla_cybertruck_user.png',insurer:'C손해보험',renew:'확인 중',update:'2026. 11. 26.',phone:'',history:'시연용 접수 기록 없음'}
];
let current='modely1',page='home',modal='',discounts=['adas'];
const v=()=>vehicles.find(x=>x.id===current);
function escapeHTML(x){return String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function changeVehicle(id){current=id;render()}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'instant'})}
function imgPlate(){let x=v();return `<div class="plate" aria-label="시연용 가상 차량번호">${escapeHTML(x.plate)}</div>`}
function vehicleHero(){let x=v();return `<div class="chooseWrap"><select aria-label="차량 선택" class="carSelect" onchange="changeVehicle(this.value)">${vehicles.map(y=>`<option value="${y.id}" ${y.id===x.id?'selected':''}>${escapeHTML(y.display)}</option>`).join('')}</select></div><p class="carIntro">차량을 선택하면 보험·사고지원 정보가 함께 변경됩니다.</p><div class="carStage ${x.id==='cyber'?'cyber':''}"><img src="${x.image}" alt="사용자가 제공한 ${x.name} 이미지"></div><div class="plateArea">${imgPlate()}<div class="plateCaption">가상 차량번호 · 시연용</div></div>`}
function insuranceCard(){let x=v();return `<section class="card"><div class="row"><span class="label">현재 가입 보험사</span><span class="status">관리자 반영 정보</span></div><div class="name">${escapeHTML(x.insurer)}</div><div class="hair"></div><div class="row"><span class="label">보험 만기일</span><b style="font-size:14px">${escapeHTML(x.renew)}</b></div><div class="row" style="margin-top:12px"><span class="label">정보 최종 갱신</span><span class="small">${escapeHTML(x.update)}</span></div><p class="notice" style="margin-bottom:0">보험 변경·갱신 내역은 운영자가 업데이트하며 고객은 수정하지 않습니다. 현재 표시된 계약은 시연용 가상 데이터입니다.</p></section>`}
function home(){return `<p class="topline">MY VEHICLE PASS</p>${vehicleHero()}${insuranceCard()}<h2 class="section">사고가 발생했다면</h2>${actions()}<h2 class="section">차량 관리</h2><button class="menuLine" onclick="go('discount')"><span>놓칠 수 있는 할인정보</span><i>›</i></button><button class="menuLine" onclick="go('history')"><span>사고접수·차량이력</span><i>›</i></button><p class="notice">이 사이트는 디자인·기능 시연용으로, 실제 보험계약 조회 및 사고접수·상담·첨부파일 전송은 지원하지 않습니다.</p>`}
function actions(){return `<button class="primary" onclick="showModal('phone')"><span class="glyph">☎</span><span><b>내 보험사 전화하기</b><small>현재 선택된 차량의 보험사 확인</small></span><span class="chev">›</span></button><button class="primary secondary" onclick="go('video')"><span class="glyph">▣</span><span><b>영상분석 접수</b><small>사고 영상과 정보를 바탕으로 분석 신청</small></span><span class="chev">›</span></button><button class="primary secondary" onclick="go('loss')"><span class="glyph">▤</span><span><b>격락손해 접수</b><small>차량 수리정보 및 관련 서류 접수</small></span><span class="chev">›</span></button>`}
function accident(){return `<p class="topline">ACCIDENT SUPPORT</p><div class="title">사고지원</div><p class="sub">선택한 차량의 보험정보와 사고지원 메뉴입니다.</p><div class="inlineVehicle"><img src="${v().image}" alt="차량 이미지">${escapeHTML(v().name)} · ${escapeHTML(v().plate||'번호 미등록')}</div>${insuranceCard()}${actions()}<p class="notice">긴급상황에서는 인명안전을 우선 확보하고 필요한 경우 119 또는 112로 연락하세요. 원패스 문의는 보험사의 공식 사고접수를 대체하지 않습니다.</p>`}
function form(kind){let video=kind==='video';return `<button class="back" onclick="go('accident')">‹ 사고지원으로 돌아가기</button><p class="topline">SERVICE REQUEST</p><div class="title">${video?'영상분석':'격락손해'} 접수</div><p class="sub">차량은 현재 선택된 정보가 자동 반영되며, 이 페이지는 시연용입니다.</p><div class="inlineVehicle"><img src="${v().image}" alt="차량 이미지"><div>${escapeHTML(v().name)}<div class="small">${escapeHTML(v().plate||'번호 미등록')}</div></div></div><form onsubmit="submitMock(event,'${kind}')"><label class="formLabel">신청자 성함</label><input class="field" name="name" required placeholder="성함" autocomplete="off"><label class="formLabel">연락처</label><input class="field" name="phone" type="tel" required placeholder="010-0000-0000"><label class="formLabel">사고 일시</label><input class="field" name="when" type="datetime-local" required><label class="formLabel">사고 장소</label><input class="field" name="where" placeholder="사고 장소 입력">${video?'<label class="formLabel">영상·사진 첨부 (체험용)</label><input class="field" type="file" accept="video/*,image/*" multiple>':'<label class="formLabel">수리견적·정비서류 첨부 (체험용)</label><input class="field" type="file" accept=".pdf,image/*" multiple>'}<label class="formLabel">사고 내용</label><textarea class="field" rows="4" placeholder="사고 내용 또는 확인이 필요한 사항"></textarea><label class="check" style="border:0"><input type="checkbox" required> 실제 데이터가 전송되지 않는 시연임을 확인</label><button class="actionButton" type="submit">모의 접수 완료</button></form>`}
function submitMock(e,kind){e.preventDefault();showModal('done')}
function discount(){const items=[['mileage','마일리지 할인'],['blackbox','블랙박스 할인'],['adas','첨단안전장치 할인'],['safe','안전운전 할인'],['child','자녀 할인'],['connected','커넥티드카 할인']];return `<p class="topline">DISCOUNT CHECK</p><div class="title">놓친 할인정보</div><p class="sub">차량·보험사별 특약 조건을 확인해야 합니다. 아래는 할인 후보 선택 시연입니다.</p><div class="inlineVehicle"><img src="${v().image}" alt="차량 이미지">${escapeHTML(v().name)} · ${escapeHTML(v().plate||'번호 미등록')}</div><section class="card">${items.map(([id,name])=>`<label class="check"><input type="checkbox" ${discounts.includes(id)?'checked':''} onchange="toggleDiscount('${id}',this.checked)">${name}</label>`).join('')}<div class="mutedBox"><div class="label">확인할 할인특약 후보</div><div class="count">${discounts.length}개</div></div></section><p class="notice">실제 할인 적용 여부·중복할인·특약 가입 가능 기간 등은 보험사와 가입조건에 따라 다릅니다.</p>`}
function toggleDiscount(id,on){discounts=on?[...new Set([...discounts,id])]:discounts.filter(x=>x!==id);render()}
function history(){let x=v();return `<p class="topline">VEHICLE HISTORY</p><div class="title">차량 이력</div><p class="sub">선택한 차량을 기준으로 표시합니다.</p><div class="inlineVehicle"><img src="${x.image}" alt="차량 이미지">${escapeHTML(x.name)} · ${escapeHTML(x.plate||'번호 미등록')}</div><div class="records"><div class="record"><span>보험사</span><b>${escapeHTML(x.insurer)}</b></div><div class="record"><span>현재 만기일</span><b>${escapeHTML(x.renew)}</b></div><div class="record"><span>원패스 사고접수 기록</span><b>${escapeHTML(x.history)}</b></div><div class="record"><span>외부 카히스토리 자료</span><b>미연동</b></div></div><p class="notice">원패스 접수기록이 없다는 사실은 실제 무사고를 보증하지 않습니다.</p>`}
function render(){document.getElementById('screen').innerHTML=({home,accident,video:()=>form('video'),loss:()=>form('loss'),discount,history})[page]();document.getElementById('nav').innerHTML=[['home','⌂','내 차량'],['accident','☎','사고지원'],['discount','％','할인정보'],['history','▤','차량이력']].map(([id,ic,l])=>`<button class="${page===id||(id==='accident'&&['video','loss'].includes(page))?'on':''}" onclick="go('${id}')"><span>${ic}</span>${l}</button>`).join('')}
function showModal(type){let x=v();document.getElementById('modalHost').innerHTML=`<div class="modalCover" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><h3>${type==='phone'?'보험사 전화 연결': '모의 신청 완료'}</h3><p>${type==='phone'?`${escapeHTML(x.name)} (${escapeHTML(x.plate||'번호 미등록')})<br>현재 보험사: <b>${escapeHTML(x.insurer)}</b><br>실제 사고접수 전화번호는 등록되어 있지 않습니다. 임의 번호로 연결하지 않습니다.`:'접수 흐름을 확인했습니다. 입력하신 정보와 첨부 파일은 외부 서버로 전송되지 않았습니다.'}</p><button onclick="closeModal()">확인</button></div></div>`}
function closeModal(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('modalHost').innerHTML=''}
render();
</script></body></html>
